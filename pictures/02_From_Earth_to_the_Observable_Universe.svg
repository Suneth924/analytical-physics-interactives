<svg viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Educational illustration explaining analytical physics through models of Earth, the solar system, a galaxy, and the observable universe">
  <rect width="1200" height="760" fill="white"/>

  <!-- Header -->
  <text x="600" y="48" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#17324d">What Is Analytical Physics?</text>
  <text x="600" y="78" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#486276">Use physical intuition to construct, analyze, and test mathematical models.</text>
  <line x1="60" y1="98" x2="1140" y2="98" stroke="#c8d5df" stroke-width="2"/>

  <!-- Scale direction -->
  <text x="67" y="125" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#36566f">INCREASING LENGTH SCALE</text>
  <line x1="278" y1="120" x2="1127" y2="120" stroke="#527a97" stroke-width="2"/>
  <path d="M1127 120 L1115 113 L1115 127 Z" fill="#527a97"/>

  <!-- Panel backgrounds -->
  <rect x="48" y="145" width="258" height="300" rx="14" fill="#f7fafc" stroke="#b9cad7" stroke-width="2"/>
  <rect x="330" y="145" width="258" height="300" rx="14" fill="#f7fafc" stroke="#b9cad7" stroke-width="2"/>
  <rect x="612" y="145" width="258" height="300" rx="14" fill="#f7fafc" stroke="#b9cad7" stroke-width="2"/>
  <rect x="894" y="145" width="258" height="300" rx="14" fill="#f7fafc" stroke="#b9cad7" stroke-width="2"/>

  <!-- Earth -->
  <text x="177" y="176" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#17324d">Earth</text>
  <circle cx="177" cy="273" r="72" fill="#4d9bd3" stroke="#245f87" stroke-width="3"/>
  <path d="M128 232 C139 214,155 213,164 222 C170 228,183 226,188 237 C180 247,169 246,163 258 C151 262,142 254,132 257 C124 250,122 240,128 232 Z" fill="#79ad61"/>
  <path d="M190 209 C211 213,228 226,237 243 C229 251,222 254,215 263 C204 261,198 252,198 244 C186 236,183 220,190 209 Z" fill="#79ad61"/>
  <path d="M177 274 C192 277,200 287,198 299 C190 307,187 320,178 331 C167 327,164 315,166 306 C154 298,157 284,177 274 Z" fill="#79ad61"/>
  <path d="M111 274 C122 269,132 270,139 279 C143 292,138 303,128 309" fill="none" stroke="#d8edf8" stroke-width="3"/>
  <ellipse cx="177" cy="273" rx="72" ry="25" fill="none" stroke="#d8edf8" stroke-width="1.5" opacity="0.8"/>
  <path d="M105 273 C125 260,229 260,249 273" fill="none" stroke="#d8edf8" stroke-width="1.2" opacity="0.7"/>
  <line x1="105" y1="371" x2="249" y2="371" stroke="#d47b45" stroke-width="2"/>
  <path d="M105 371 L114 366 L114 376 Z M249 371 L240 366 L240 376 Z" fill="#d47b45"/>
  <text x="177" y="397" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#263f52">diameter ≈ 10<tspan baseline-shift="super" font-size="10">7</tspan> m</text>
  <text x="177" y="423" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#5c7181">Useful model: rotating sphere</text>

  <!-- Solar system -->
  <text x="459" y="176" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#17324d">Solar System</text>
  <circle cx="459" cy="274" r="22" fill="#f6bf4a" stroke="#dc8e25" stroke-width="2"/>
  <circle cx="459" cy="274" r="30" fill="none" stroke="#f3d589" stroke-width="2" opacity="0.55"/>
  <ellipse cx="459" cy="274" rx="48" ry="21" fill="none" stroke="#8da7ba" stroke-width="1.2"/>
  <ellipse cx="459" cy="274" rx="73" ry="34" fill="none" stroke="#8da7ba" stroke-width="1.2"/>
  <ellipse cx="459" cy="274" rx="100" ry="48" fill="none" stroke="#8da7ba" stroke-width="1.2"/>
  <ellipse cx="459" cy="274" rx="119" ry="60" fill="none" stroke="#8da7ba" stroke-width="1.2"/>
  <circle cx="504" cy="282" r="4" fill="#818b94"/>
  <circle cx="397" cy="256" r="5" fill="#d6904f"/>
  <circle cx="548" cy="252" r="7" fill="#c68b58"/>
  <circle cx="366" cy="310" r="6" fill="#d6b46f"/>
  <ellipse cx="366" cy="310" rx="10" ry="3" fill="none" stroke="#a97a44" stroke-width="1.5" transform="rotate(12 366 310)"/>
  <circle cx="459" cy="274" r="3" fill="#fff7d5"/>
  <text x="459" y="344" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#5c7181">orbits not to scale</text>
  <line x1="350" y1="371" x2="568" y2="371" stroke="#d47b45" stroke-width="2"/>
  <path d="M350 371 L359 366 L359 376 Z M568 371 L559 366 L559 376 Z" fill="#d47b45"/>
  <text x="459" y="397" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#263f52">planetary region ≈ 10<tspan baseline-shift="super" font-size="10">13</tspan> m</text>
  <text x="459" y="423" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#5c7181">Useful model: bodies in orbit</text>

  <!-- Spiral galaxy -->
  <text x="741" y="176" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#17324d">Spiral Galaxy</text>
  <ellipse cx="741" cy="274" rx="112" ry="76" fill="#eaf1f7" stroke="#9ab1c2" stroke-width="2"/>
  <ellipse cx="741" cy="274" rx="27" ry="18" fill="#f1c862" opacity="0.9"/>
  <circle cx="741" cy="274" r="7" fill="#fff5c2"/>
  <path d="M741 274 C758 248,797 245,824 263 C842 275,837 297,816 309" fill="none" stroke="#5a78a9" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
  <path d="M741 274 C724 299,683 305,653 287 C634 276,641 253,663 240" fill="none" stroke="#5a78a9" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
  <path d="M741 274 C724 249,693 245,670 259 C654 269,658 287,676 298" fill="none" stroke="#859bc2" stroke-width="5" stroke-linecap="round"/>
  <path d="M741 274 C758 298,789 301,811 287 C826 277,823 262,808 251" fill="none" stroke="#859bc2" stroke-width="5" stroke-linecap="round"/>
  <g fill="#ffffff">
    <circle cx="666" cy="267" r="2"/><circle cx="685" cy="231" r="2"/><circle cx="704" cy="292" r="2"/>
    <circle cx="715" cy="246" r="1.7"/><circle cx="770" cy="243" r="2"/><circle cx="792" cy="284" r="2"/>
    <circle cx="817" cy="276" r="1.8"/><circle cx="775" cy="314" r="2"/><circle cx="694" cy="318" r="1.8"/>
  </g>
  <line x1="629" y1="371" x2="853" y2="371" stroke="#d47b45" stroke-width="2"/>
  <path d="M629 371 L638 366 L638 376 Z M853 371 L844 366 L844 376 Z" fill="#d47b45"/>
  <text x="741" y="397" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#263f52">diameter ≈ 10<tspan baseline-shift="super" font-size="10">21</tspan> m</text>
  <text x="741" y="423" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#5c7181">Useful model: stars + gravity</text>

  <!-- Observable universe -->
  <text x="1023" y="176" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#17324d">Observable Universe</text>
  <circle cx="1023" cy="274" r="83" fill="#eef3f8" stroke="#506f98" stroke-width="3"/>
  <circle cx="1023" cy="274" r="63" fill="none" stroke="#9eb1c9" stroke-width="1.2"/>
  <circle cx="1023" cy="274" r="40" fill="none" stroke="#9eb1c9" stroke-width="1.2"/>
  <path d="M950 254 Q984 222 1010 252 T1088 244 M949 294 Q982 269 1016 294 T1093 287 M975 207 Q997 249 977 283 T997 337 M1048 202 Q1030 242 1054 274 T1044 339" fill="none" stroke="#8098b5" stroke-width="1.2" opacity="0.8"/>
  <g fill="#6d5aa7">
    <circle cx="975" cy="247" r="4"/><circle cx="1005" cy="220" r="3"/><circle cx="1041" cy="239" r="4"/>
    <circle cx="1072" cy="267" r="3"/><circle cx="1048" cy="305" r="4"/><circle cx="1006" cy="318" r="3"/>
    <circle cx="983" cy="285" r="3"/><circle cx="1022" cy="271" r="4"/><circle cx="1080" cy="306" r="2.5"/>
  </g>
  <g stroke="#a48ac4" stroke-width="1.5">
    <line x1="975" y1="247" x2="1005" y2="220"/><line x1="1005" y1="220" x2="1041" y2="239"/>
    <line x1="1041" y1="239" x2="1072" y2="267"/><line x1="1072" y1="267" x2="1048" y2="305"/>
    <line x1="1048" y1="305" x2="1006" y2="318"/><line x1="1006" y1="318" x2="983" y2="285"/>
    <line x1="983" y1="285" x2="1022" y2="271"/><line x1="1022" y1="271" x2="1041" y2="239"/>
  </g>
  <text x="1023" y="366" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#5c7181">schematic cosmic horizon</text>
  <line x1="914" y1="384" x2="1132" y2="384" stroke="#d47b45" stroke-width="2"/>
  <path d="M914 384 L923 379 L923 389 Z M1132 384 L1123 379 L1123 389 Z" fill="#d47b45"/>
  <text x="1023" y="408" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#263f52">diameter ≈ 10<tspan baseline-shift="super" font-size="10">27</tspan> m</text>
  <text x="1023" y="430" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#5c7181">Useful model: expanding cosmos</text>

  <!-- Bottom analytical-physics section -->
  <rect x="48" y="472" width="1104" height="238" rx="16" fill="#f4f8f5" stroke="#9bbba5" stroke-width="2"/>
  <text x="76" y="505" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#214c38">One method works across every scale</text>
  <text x="1125" y="505" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#b55f35">INTUITION FIRST → MATHEMATICS SECOND</text>

  <!-- Workflow boxes -->
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="70" y="530" width="150" height="66" rx="10" fill="white" stroke="#5e9270" stroke-width="2"/>
    <text x="145" y="555" text-anchor="middle" font-size="14" font-weight="700" fill="#214c38">1. Observe</text>
    <text x="145" y="578" text-anchor="middle" font-size="12.5" fill="#536b5d">What changes? What stays?</text>

    <path d="M225 563 H246" stroke="#527a60" stroke-width="2"/>
    <path d="M246 563 L237 558 L237 568 Z" fill="#527a60"/>

    <rect x="251" y="530" width="150" height="66" rx="10" fill="white" stroke="#5e9270" stroke-width="2"/>
    <text x="326" y="555" text-anchor="middle" font-size="14" font-weight="700" fill="#214c38">2. Choose quantities</text>
    <text x="326" y="578" text-anchor="middle" font-size="12.5" fill="#536b5d">size L, time T, mass M</text>

    <path d="M406 563 H427" stroke="#527a60" stroke-width="2"/>
    <path d="M427 563 L418 558 L418 568 Z" fill="#527a60"/>

    <rect x="432" y="530" width="150" height="66" rx="10" fill="white" stroke="#5e9270" stroke-width="2"/>
    <text x="507" y="555" text-anchor="middle" font-size="14" font-weight="700" fill="#214c38">3. Make assumptions</text>
    <text x="507" y="578" text-anchor="middle" font-size="12.5" fill="#536b5d">Keep dominant effects</text>

    <path d="M587 563 H608" stroke="#527a60" stroke-width="2"/>
    <path d="M608 563 L599 558 L599 568 Z" fill="#527a60"/>

    <rect x="613" y="530" width="150" height="66" rx="10" fill="white" stroke="#5e9270" stroke-width="2"/>
    <text x="688" y="555" text-anchor="middle" font-size="14" font-weight="700" fill="#214c38">4. Build a model</text>
    <text x="688" y="578" text-anchor="middle" font-size="12.5" fill="#536b5d">Represent the system simply</text>

    <path d="M768 563 H789" stroke="#527a60" stroke-width="2"/>
    <path d="M789 563 L780 558 L780 568 Z" fill="#527a60"/>

    <rect x="794" y="530" width="150" height="66" rx="10" fill="white" stroke="#5e9270" stroke-width="2"/>
    <text x="869" y="555" text-anchor="middle" font-size="14" font-weight="700" fill="#214c38">5. Reason &amp; predict</text>
    <text x="869" y="578" text-anchor="middle" font-size="12.5" fill="#536b5d">Use trends and simple math</text>

    <path d="M949 563 H970" stroke="#527a60" stroke-width="2"/>
    <path d="M970 563 L961 558 L961 568 Z" fill="#527a60"/>

    <rect x="975" y="530" width="150" height="66" rx="10" fill="white" stroke="#5e9270" stroke-width="2"/>
    <text x="1050" y="555" text-anchor="middle" font-size="14" font-weight="700" fill="#214c38">6. Test validity</text>
    <text x="1050" y="578" text-anchor="middle" font-size="12.5" fill="#536b5d">Where does it work?</text>
  </g>

  <!-- Intuition and simple mathematics -->
  <rect x="70" y="620" width="508" height="66" rx="10" fill="#fffaf2" stroke="#dcaa67" stroke-width="1.8"/>
  <text x="89" y="645" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#8b532c">Qualitative intuition</text>
  <text x="89" y="669" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#654f3e">Which objects interact? Which effect is strongest? What scale matters?</text>

  <rect x="600" y="620" width="525" height="66" rx="10" fill="#f7f3fb" stroke="#a58bbb" stroke-width="1.8"/>
  <text x="620" y="645" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#684b80">Simple mathematics supports the picture</text>
  <text x="620" y="670" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#463654">typical speed ≈ size / time  →  v ≈ L / T</text>

  <!-- Footer message -->
  <text x="600" y="738" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#36566f">Physics is not equation memorization: every equation belongs to a model with assumptions and limits.</text>
</svg>